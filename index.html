<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeleClaw</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #122033, #050608 70%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      padding: 32px;
      border-radius: 28px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 40px rgba(0,200,255,0.18);
    }
    h1 {
      font-size: 42px;
      margin: 0;
    }
    .red {
      color: #ff2b2b;
    }
    p {
      color: #cbd5e1;
      font-size: 17px;
      line-height: 1.6;
    }
    .badge {
      margin-top: 20px;
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff2b2b, #00d5ff);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>TELE<span class="red">CLAW</span></h1>
    <p>AI workspace for builders. Create agents, Android apps, workflows, automation systems, and developer tools from one intelligent assistant.</p>
    <div class="badge">Code • Build • Automate • Deploy</div>
  </div>
</body>
</html>
